name: Daily weather log

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run python script
        run: python Weatherjob_job.py
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}